[package]
name = "hangul-learner"
version = "1.6.0"
description = "Learn to read, write and hear Korean Hangul"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1" # used by the code tauri generates for plugin settings (updater)
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
# pronunciation check: Windows speech recognition (same version Tauri already uses)
windows-collections = "0.3"
windows = { version = "0.62", features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
