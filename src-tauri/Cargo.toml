[package]
name = "hangul-learner"
version = "1.7.3"
description = "Learn to read, write and hear Korean Hangul"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# no "compression": brotli at build time is slow on 200 MB of audio that is already compressed (Opus); the installer compresses the rest
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde_json = "1" # used by the code tauri generates for plugin settings (updater)
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
# pronunciation check: Windows speech recognition (same version Tauri already uses)
windows-collections = "0.3"
windows = { version = "0.62", features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
