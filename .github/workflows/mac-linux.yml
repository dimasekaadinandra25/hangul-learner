# macOS and Linux versions. `npm run release` (on Windows) publishes the Windows installer and latest.json; publishing
# that release starts this workflow, which builds the Mac app (Apple Silicon + Intel) and Linux AppImage/.deb, uploads
# them to the same release and adds their entries to latest.json, so installed apps on every system update themselves.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (contents of %USERPROFILE%\.tauri\hangul-learner.key).
# Mac builds are not signed by an Apple developer account: the first launch needs right-click › Open.
name: Mac and Linux builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build for, e.g. v1.6.0
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.event.release.tag_name || inputs.tag }}
          tauriScript: npx tauri # package.json has no "tauri" script
          args: ${{ matrix.args }}
          includeUpdaterJson: true
